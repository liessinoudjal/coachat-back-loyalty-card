# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    legal_terms_current_version: '%env(LEGAL_TERMS_CURRENT_VERSION)%'
    promotional_offers_cron_token: '%env(default::PROMOTIONAL_OFFERS_CRON_TOKEN)%'
    promotional_offers_cron_basic_user: '%env(default::PROMOTIONAL_OFFERS_CRON_BASIC_USER)%'
    promotional_offers_cron_basic_password: '%env(default::PROMOTIONAL_OFFERS_CRON_BASIC_PASSWORD)%'
    promotional_offers_cron_header_name: '%env(default::PROMOTIONAL_OFFERS_CRON_HEADER_NAME)%'
    promotional_offers_cron_header_value: '%env(default::PROMOTIONAL_OFFERS_CRON_HEADER_VALUE)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\Service\ApplePassService:
        arguments:
            $certPath: '%env(APPLE_WALLET_CERT_PATH)%'
            $certPassword: '%env(APPLE_WALLET_CERT_PASSWORD)%'
            $passTypeIdentifier: '%env(APPLE_WALLET_PASS_TYPE_IDENTIFIER)%'
            $teamIdentifier: '%env(APPLE_WALLET_TEAM_IDENTIFIER)%'
            $organizationName: '%env(APPLE_WALLET_ORGANIZATION_NAME)%'
            $baseUrl: '%env(APP_BASE_URL)%'

    App\Service\GooglePassService:
        arguments:
            $googleServiceAccountEmail: '%env(GOOGLE_WALLET_SERVICE_ACCOUNT_EMAIL)%'
            $googleServiceAccountKeyPath: '%env(GOOGLE_WALLET_SERVICE_ACCOUNT_KEY_PATH)%'
            $googleIssuerId: '%env(GOOGLE_WALLET_ISSUER_ID)%'
            $googleClassSuffix: '%env(GOOGLE_WALLET_CLASS_SUFFIX)%'

    App\Controller\LoyaltyCardController:
        arguments:
            $appBaseUrl: '%env(APP_BASE_URL)%'

    App\Service\AppleWalletPushService:
        arguments:
            $enabled: '%env(bool:APPLE_WALLET_ENABLED)%'
            $passTypeIdentifier: '%env(APPLE_WALLET_PASS_TYPE_IDENTIFIER)%'
            $teamIdentifier: '%env(APPLE_WALLET_TEAM_IDENTIFIER)%'
            $keyId: '%env(APPLE_APNS_KEY_ID)%'
            $privateKeyPath: '%env(APPLE_APNS_PRIVATE_KEY_PATH)%'

    App\Service\GoogleWalletSyncService:
        arguments:
            $enabled: '%env(bool:GOOGLE_WALLET_ENABLED)%'
            $issuerId: '%env(GOOGLE_WALLET_ISSUER_ID)%'
            $serviceAccountKeyPath: '%env(GOOGLE_WALLET_SERVICE_ACCOUNT_KEY_PATH)%'

    App\Service\LegalTermsVersionProvider:
        arguments:
            $currentVersion: '%legal_terms_current_version%'

    App\Service\SignupAlertMailer:
        arguments:
            $customerLogger: '@monolog.logger.notification_customer'
            $merchantLogger: '@monolog.logger.notification_merchant'
            $alertRecipient: '%env(SIGNUP_ALERT_EMAIL)%'
            $fromEmail: '%env(SIGNUP_ALERT_FROM_EMAIL)%'
            $fromName: '%env(SIGNUP_ALERT_FROM_NAME)%'

    App\Service\MerchantStaffAlertMailer:
        arguments:
            $merchantLogger: '@monolog.logger.notification_merchant'
            $fromEmail: '%env(SIGNUP_ALERT_FROM_EMAIL)%'
            $fromName: '%env(SIGNUP_ALERT_FROM_NAME)%'
            $appFrontBaseUrl: '%env(APP_FRONT_BASE_URL)%'

    App\EventSubscriber\ApplicationErrorLoggerSubscriber:
        arguments:
            $errorAlertEmail: '%env(SIGNUP_ALERT_EMAIL)%'
            $fromEmail: '%env(SIGNUP_ALERT_FROM_EMAIL)%'
            $fromName: '%env(SIGNUP_ALERT_FROM_NAME)%'

    App\Service\EmailNotificationStrategy:
        arguments:
            $logger: '@monolog.logger.notification_customer'
            $fromEmail: '%env(SIGNUP_ALERT_FROM_EMAIL)%'
            $fromName: '%env(SIGNUP_ALERT_FROM_NAME)%'

    App\Service\NotificationService:
        arguments:
            $logger: '@monolog.logger.notification_customer'
            $appFrontBaseUrl: '%env(APP_FRONT_BASE_URL)%'

    App\Controller\PromotionalOfferController:
        arguments:
            $logger: '@monolog.logger.promotional_offer_dispatch'
            $promotionalOffersCronToken: '%promotional_offers_cron_token%'
            $promotionalOffersCronBasicUser: '%promotional_offers_cron_basic_user%'
            $promotionalOffersCronBasicPassword: '%promotional_offers_cron_basic_password%'
            $promotionalOffersCronHeaderName: '%promotional_offers_cron_header_name%'
            $promotionalOffersCronHeaderValue: '%promotional_offers_cron_header_value%'

    App\Service\PromotionalOfferNotificationDispatcher:
        arguments:
            $logger: '@monolog.logger.promotional_offer_dispatch'

    App\EventSubscriber\ApplicationErrorLoggerSubscriber:
        arguments:
            $logger: '@monolog.logger.app_error'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
