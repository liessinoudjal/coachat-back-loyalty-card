monolog:
    channels:
        - app_error
        - notification_customer
        - notification_merchant
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            app_error:
                type: stream
                path: "%kernel.logs_dir%/app_error.log"
                level: error
                channels: [app_error]
            notification_customer:
                type: stream
                path: "%kernel.logs_dir%/notification_customer.log"
                level: debug
                channels: [notification_customer]
            notification_merchant:
                type: stream
                path: "%kernel.logs_dir%/notification_merchant.log"
                level: debug
                channels: [notification_merchant]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
            app_error:
                type: stream
                path: "%kernel.logs_dir%/app_error.log"
                level: error
                channels: [app_error]
            notification_customer:
                type: stream
                path: "%kernel.logs_dir%/notification_customer.log"
                level: debug
                channels: [notification_customer]
            notification_merchant:
                type: stream
                path: "%kernel.logs_dir%/notification_merchant.log"
                level: debug
                channels: [notification_merchant]

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
            app_error:
                type: stream
                path: "%kernel.logs_dir%/app_error.log"
                level: error
                channels: [app_error]
                formatter: monolog.formatter.json
            notification_customer:
                type: stream
                path: "%kernel.logs_dir%/notification_customer.log"
                level: info
                channels: [notification_customer]
                formatter: monolog.formatter.json
            notification_merchant:
                type: stream
                path: "%kernel.logs_dir%/notification_merchant.log"
                level: info
                channels: [notification_merchant]
                formatter: monolog.formatter.json
