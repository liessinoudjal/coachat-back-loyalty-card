security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    role_hierarchy:
        ROLE_SUPER_ADMIN: ROLE_MERCHANT

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        preflight:
            # Allow CORS preflight OPTIONS requests without authentication
            pattern: ^/
            methods: [OPTIONS]
            security: false
        public:
            pattern: ^/public/
            security: false
        api:
            pattern: ^/api
            stateless: true
            jwt: ~
        main:
            lazy: true
            provider: app_user_provider

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/api/auth/google$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/google/callback$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/merchant/register-form$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/merchant/login-form$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/customer/google$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/customer/register-form$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/customer/login-form$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/customer/google/callback$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/refresh$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/email/verify$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/email/resend-verification$, roles: PUBLIC_ACCESS }
        - { path: ^/api/public/merchants/map, roles: PUBLIC_ACCESS }
        - { path: ^/api/public/merchants/search, roles: PUBLIC_ACCESS }
        - { path: ^/api/public/merchants/, roles: PUBLIC_ACCESS }
        - { path: ^/api/legal/terms/current-version, roles: PUBLIC_ACCESS }
        - { path: ^/api/plans, roles: PUBLIC_ACCESS }
        - { path: ^/api/subscription/webhook, roles: PUBLIC_ACCESS }
        # - { path: ^/admin, roles: ROLE_ADMIN }
        # - { path: ^/profile, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
